# Local git hooks. CI runs the same checks; hooks only fail fast on your machine.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,mjs,json,md,yml,yaml}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,mjs}'
      run: pnpm eslint --max-warnings=0 {staged_files}
    conventions:
      run: pnpm check:conventions
commit-msg:
  commands:
    commitlint:
      # NOTE: {1} is not shell-escaped, and worktree git dirs can contain spaces.
      run: pnpm commitlint --edit "{1}"
pre-push:
  commands:
    ownership:
      run: pnpm check:ownership
