# Code quality gates. Job names are required status checks on main; rename them only together with the ruleset.
# SECURITY: CI must never receive ANTHROPIC_API_KEY. Tests use fake model ports; live evals run only
# by hand (ADR-0015 §9). scripts/test/ci-model-key.test.mjs fails if any workflow passes the key or all secrets to a job.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:conventions
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Throwaway database for *.integration.test.ts; the credentials exist only inside this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caa
          POSTGRES_PASSWORD: caa
          POSTGRES_DB: caa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caa -d caa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        env:
          DATABASE_URL: postgres://caa:caa@localhost:5432/caa
      # ADR-0010 Amendment 3: the 2 s target is measured without coverage, so this is a separate
      # run from `pnpm test:coverage`. It needs the same DATABASE_URL: the root vitest config
      # throws in CI without it (integration mode `fail`), which stays enforced. The engine
      # project filter keeps the run to the calibration file; no integration test is selected.
      - name: Solver calibration (ADR-0010 §1, Amendment 3)
        run: >-
          pnpm exec vitest run --project packages/engine
          packages/engine/src/scheduling/solve-schedule.calibration.test.ts
          --reporter=default --reporter=json --outputFile=solver-calibration.json
          && node scripts/check-solver-calibration.mjs solver-calibration.json
        env:
          DATABASE_URL: postgres://caa:caa@localhost:5432/caa

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Browser tests (ADR-0016 §3). Not part of `pnpm verify`. Throwaway database; the credentials
    # exist only inside this job. No secrets: the stack runs with dev auth and the demo model.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caa
          POSTGRES_PASSWORD: caa
          POSTGRES_DB: caa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caa -d caa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://caa:caa@localhost:5432/caa
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @caa/tests exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system packages
        run: pnpm --filter @caa/tests exec playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - name: Install system packages only (browser cached)
        run: pnpm --filter @caa/tests exec playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: pnpm --filter @caa/db db:migrate
      - run: pnpm --filter @caa/db db:seed
      - run: pnpm e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 7
