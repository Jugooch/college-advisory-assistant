name: Bug
description: Something behaves incorrectly.
title: 'fix(<scope>): <short description>'
labels: [bug]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Critical = false academic eligibility, unauthorized access, hidden unsupported claim, or institutional write.
      options: [critical, high, medium, low]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (synthetic data only)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Suspected area / owner
